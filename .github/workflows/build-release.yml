name: Build Windows portable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing release tag to receive the portable assets (for example v0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source and run tests
        run: npm run check && npm test

      - name: Build portable executable
        run: npm run dist -- --publish never

      - name: Write checksum
        shell: powershell
        run: |
          $asset = Get-ChildItem 'dist\*.exe' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
          "$hash  $($asset.Name)" | Out-File 'dist\SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
